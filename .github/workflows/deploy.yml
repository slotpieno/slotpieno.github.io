name: Deploy SlotPieno landing on GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'slotpieno-landing/**'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slotpieno-landing/package-lock.json
      - name: Install
        run: |
          cd slotpieno-landing
          npm ci --no-audit --no-fund
      - name: Build
        run: |
          cd slotpieno-landing
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: slotpieno-landing/dist
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
